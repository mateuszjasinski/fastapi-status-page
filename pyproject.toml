[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-status-page"
dynamic = ["version"]
description = "A simple, extensible status page for FastAPI applications with pluggable dependency health checks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mateusz Jasinski", email = "mateusz@jasinski.software" }]
keywords = ["fastapi", "status", "health", "healthcheck", "monitoring", "readiness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.110",
    # Imported directly (BaseModel, run_in_threadpool, responses). These are
    # guaranteed by FastAPI today, but declared explicitly since we import them.
    "pydantic>=2",
    "starlette>=0.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/mateuszjasinski/fastapi-status-page"
Repository = "https://github.com/mateuszjasinski/fastapi-status-page"
Issues = "https://github.com/mateuszjasinski/fastapi-status-page/issues"

[tool.hatch.version]
path = "src/fastapi_status_page/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_status_page"]

[tool.hatch.build.targets.sdist]
# Keep the sdist to source + docs users actually need; drop CI/IDE/tooling cruft.
exclude = [
    "/.github",
    "/.idea",
    "/docs",
    "/uv.lock",
    "/.pre-commit-config.yaml",
    "/local.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff-specific rules
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]
# rendering.py is essentially an HTML template; long inline-style lines are expected.
"src/fastapi_status_page/rendering.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["fastapi_status_page"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov=fastapi_status_page --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src/fastapi_status_page"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
